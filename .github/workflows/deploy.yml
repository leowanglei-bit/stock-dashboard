# 部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天 21:40 UTC（= 05:40 CST）刷新宽基估值后再构建部署。
  # 注意：数据源本身是周频采样，多数日子刷新结果不变，页面「数据日」不会天天变。
  schedule:
    - cron: '40 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 定时/手动触发时才重新取估值（push 构建用仓库里的 JSON，避免外网接口故障挡住发布）
      - name: Refresh index valuation
        if: github.event_name != 'push'
        run: |
          npm run refresh:valuation || {
            echo "::warning title=估值刷新失败::沿用仓库内 src/data/indexValuation.json，页面数据日会停在旧值";
          }

      - name: Build
        run: npm run build
        env:
          # 兼容旧 Secret 名：优先用 NEXT_PUBLIC_*，未配置时退回 VITE_*
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          # GitHub Pages 项目站点部署在 /stock-dashboard/ 子路径
          NEXT_PUBLIC_BASE_PATH: /stock-dashboard

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
